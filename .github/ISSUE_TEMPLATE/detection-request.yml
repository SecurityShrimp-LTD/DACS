name: Detection request
description: The single front door for new detection coverage. Phase 1 of the lifecycle.
title: "[detection] "
labels: ["detection-request", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Every detection starts here. Requests that arrive by chat or email get
        pointed back to this form. Incomplete requests are not triaged.
  - type: dropdown
    id: source
    attributes:
      label: Requirement source
      options: [threat_intel, red_team, purple_team, incident, compliance, vendor_gap, hunt, new_technology]
    validations: { required: true }
  - type: textarea
    id: behavior
    attributes:
      label: Adversary behavior to detect
      description: Describe the procedure, not the tool name. What does the adversary actually do on the host or the wire.
    validations: { required: true }
  - type: input
    id: attack
    attributes:
      label: ATT&CK technique
      placeholder: T1071.004
    validations: { required: true }
  - type: input
    id: reference
    attributes:
      label: Reference
      description: Threat intel report, red team finding, incident number or CVE.
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes:
      label: Threat severity if undetected
      options: ["1 low", "2 moderate", "3 significant", "4 severe"]
    validations: { required: true }
  - type: dropdown
    id: relevance
    attributes:
      label: Relevance to our environment
      description: Does this technique apply to platforms and assets we actually run.
      options: ["1 edge case", "2 some assets", "3 broad", "4 crown jewels"]
    validations: { required: true }
  - type: dropdown
    id: existing
    attributes:
      label: Existing coverage
      options: ["1 solid coverage exists", "2 partial or brittle", "3 adjacent only", "4 none"]
    validations: { required: true }
  - type: dropdown
    id: active
    attributes:
      label: Active exploitation
      options: ["1 theoretical", "2 reported in the wild", "3 active in our sector", "4 observed against us"]
    validations: { required: true }
  - type: input
    id: logsource
    attributes:
      label: Expected data source
      description: Which log source would carry the evidence. Say unknown if that is the honest answer.
    validations: { required: true }
  - type: textarea
    id: validation
    attributes:
      label: How would we detonate this safely
      description: A flightsim module, an Atomic test number, a Stratus technique, or a manual procedure. Blank is acceptable, it becomes part of the investigate phase.

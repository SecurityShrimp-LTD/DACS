name: Detection tuning
description: A production rule is over budget, imprecise or broken. Opened by hand or automatically by the volume job.
title: "[tuning] "
labels: ["tuning"]
body:
  - type: input
    id: rule_id
    attributes: { label: Rule id }
    validations: { required: true }
  - type: dropdown
    id: problem
    attributes:
      label: Problem
      options: [over volume budget, false positives, rule is not firing, logic error, data source changed, response guidance is wrong]
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: Alert counts, sample events, analyst feedback. }
    validations: { required: true }
  - type: dropdown
    id: proposal
    attributes:
      label: Proposed action
      options: [tune logic, add suppression, downgrade to hunt_only, raise volume budget, deprecate]

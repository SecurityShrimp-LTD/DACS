name: deploy

# Gate 7. Only rules at lifecycle stage production ship. Tagged, reversible,
# and gated behind a protected environment so a merge alone cannot page the SOC.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: siem-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r tools/requirements.txt
      - name: Compile and push to staging
        run: python tools/deploy.py --target staging --stage production --stage in_test
        env:
          SIEM_URL: ${{ vars.SIEM_URL_STAGING }}
          SIEM_TOKEN: ${{ secrets.SIEM_TOKEN_STAGING }}

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: siem-production     # add required reviewers in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r tools/requirements.txt
      - name: Compile and push production stage rules only
        run: python tools/deploy.py --target production --stage production
        env:
          SIEM_URL: ${{ vars.SIEM_URL_PROD }}
          SIEM_TOKEN: ${{ secrets.SIEM_TOKEN_PROD }}
      - name: Notify the SOC
        run: python tools/notify.py --release "${{ github.ref_name }}"
        env:
          SOC_WEBHOOK: ${{ secrets.SOC_WEBHOOK }}

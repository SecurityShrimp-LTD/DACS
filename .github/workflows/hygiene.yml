name: hygiene

# Keeps the ruleset from rotting. Weekly, opens issues instead of failing builds.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r tools/requirements.txt
      - name: Report rules past review date or past validation freshness
        run: |
          mkdir -p build
          python tools/validate_rules.py | tee build/hygiene-report.txt || true
      - name: Publish metrics
        run: python tools/coverage_report.py
      - uses: actions/upload-artifact@v4
        with: { name: weekly-hygiene, path: build/ }

      # One standing issue rather than one per week: updated while findings
      # remain, closed when a run comes back clean.
      - name: Open, update or close the hygiene issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Weekly detection hygiene findings';
            const { owner, repo } = context.repo;
            const findings = fs.readFileSync('build/hygiene-report.txt', 'utf8')
              .split('\n').filter(l => /^(WARN|ERROR) /.test(l));
            const open = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open' }))
              .find(i => !i.pull_request && i.title === title);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            if (!findings.length) {
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Clean run, closing. ${run}` });
                await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
              }
              return;
            }

            const body = [
              `${findings.length} findings from the hygiene run on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              'Stale review: re-review the rule and bump `last_reviewed`, or start deprecation.',
              'Decaying validation: find out why the nightly detonation stopped passing.',
              'Errors: the rule no longer meets the schema or program standards.',
              '',
              '```',
              findings.join('\n').slice(0, 60000),
              '```',
              '',
              `Run: ${run}`,
            ].join('\n');
            if (open) {
              await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['hygiene'] });
            }

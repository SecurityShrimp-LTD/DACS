name: validate

# Gate 1 and 2. Runs on every pull request. Cheap, fast, blocking.
# No paths filter: these jobs are required status checks, and a filtered out
# workflow never reports, which leaves a docs or CODEOWNERS pull request
# unmergeable. The validator also checks ADS and runbook files under docs/.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  schema-and-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r tools/requirements.txt
      - name: Validate rule schema and program standards
        run: python tools/validate_rules.py

  sigma-convert:
    # Proves every rule compiles to the target query language before anyone
    # tries to deploy it. Swap the backend list for your platform.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [splunk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r tools/requirements.txt
      - run: sigma plugin install ${{ matrix.backend }}
      - name: Convert
        run: |
          mkdir -p build/${{ matrix.backend }}
          sigma convert --target ${{ matrix.backend }} --without-pipeline \
            --output build/${{ matrix.backend }}/rules.txt detections/ || \
            { echo "::error::conversion failed for ${{ matrix.backend }}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-${{ matrix.backend }}
          path: build/${{ matrix.backend }}

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r tools/requirements.txt
      - name: Replay fixtures against rule logic
        run: pytest tests/unit -q

  coverage:
    needs: [schema-and-standards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r tools/requirements.txt
      - run: python tools/coverage_report.py
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: build/ }

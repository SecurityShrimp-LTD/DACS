# Threatest scenarios for network layer detections.
#
# Detonator keys confirmed from the Threatest README: remoteDetonator,
# stratusRedTeamDetonator, awsCliDetonator. Check schemas/threatest.schema.json
# in the upstream repo before adding a local detonator block, and wire that
# schema into your editor for autocompletion.
#
# Correlation caveat: flightsim does not emit a Threatest correlation UUID.
# These assertions bind on signal name plus time window plus the source host,
# so run them from a dedicated detonation host whose address is not shared with
# anything else that could trip the same rule.
scenarios:
  - name: DNS tunneling detected from egress host
    detonate:
      remoteDetonator:
        commands:
          - "flightsim run tunnel-dns -fast"
    expectations:
      - timeout: 10m
        datadogSecuritySignal:
          name: "DNS Tunneling via High Volume Unique Subdomains"
          severity: high

